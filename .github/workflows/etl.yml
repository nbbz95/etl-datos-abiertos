name: ETL y publicación

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 22 * * *" # todos los días
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      - name: Correr ETL (extract, load, transform, tests de datos)
        run: python -m etl --destino site
      - name: Publicar en GitHub Pages (rama gh-pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
